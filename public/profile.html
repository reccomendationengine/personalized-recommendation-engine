<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: linear-gradient(135deg, darkcyan 0%, darkorchid 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    .profile-wrapper {
      display: flex;
      gap: 2rem;
      width: 100%;
      max-width: 1100px;
    }

    .profile-container {
      flex: 2;
      background: rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.5);
      margin-top: 1rem;
    }

    .profile-info {
      margin-top: 2rem;
      text-align: left;
      font-size: 1.2rem;
      line-height: 2rem;
    }

    .profile-info strong {
      color: black;
    }

    .btn-container {
      margin-top: 2.5rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .delete-btn {
      background: rgba(255, 0, 0, 0.3);
      border-color: rgba(255, 0, 0, 0.5);
    }

    .delete-btn:hover {
      background: rgba(255, 0, 0, 0.5);
    }

    .password-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.15);
      padding: 2rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: left;
      height: fit-content;
    }

    .password-box h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    #changePicInput {
      display: none;
    }

    @media (max-width: 900px) {
      .profile-wrapper {
        flex-direction: column;
      }
    }

    /* Modal */
    .modal-content .btn {
      background: linear-gradient(135deg, darkcyan 0%, darkorchid 100%);
      color: white;
      border: none;
      width: 100%;
      margin-top: 0.5rem;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      color: black;
      padding: 2rem;
      border-radius: 15px;
      width: 350px;
    }

    .modal-content input {
      width: 100%;
      padding: 0.7rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .close-btn {
      background: darkred;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    .back-btn {
      position: absolute;
      top: 2rem;
      left: 2rem;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: Inter, sans-serif;
      z-index: 1000;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <a href="dashboard.html" class="back-btn">
    ← Back to Dashboard
  </a>

  <div class="profile-wrapper">

    <!-- LEFT SECTION -->
    <div class="profile-container">
      <h1>Your Profile</h1>

      <img id="profilePic" src="" alt="Profile Picture" class="profile-pic">
      <br>
      <button id="changePicBtn" class="btn" style="margin-top: 1rem;">📸 Change Picture</button>
      <input type="file" id="changePicInput" accept="image/*">

      <div class="profile-info">
        <p><strong>Name:</strong> <span id="profileName">Loading...</span></p>
        <p><strong>Email:</strong> <span id="profileEmail">Loading...</span></p>
        <p><strong>Date of Birth:</strong> <span id="profileDOB">Loading...</span></p>
        <p><strong>Phone:</strong> <span id="profilePhone">Loading...</span></p>
      </div>

      <div class="btn-container">
        <button id="editBtn" class="btn">✏ Edit Profile</button>
        <button id="logoutBtn" class="btn">🚪 Logout</button>
        <button id="deleteAccountBtn" class="btn delete-btn">🗑 Delete Account</button>
      </div>
    </div>

    <!-- PASSWORD SECTION -->
    <div class="password-box">
      <h2>Change Password</h2>
      <button id="sendVerificationBtn" class="btn" style="width:100%;">📧 Send Verification Email</button>
    </div>

  </div>

  <!-- Modal for Editing Profile -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>Edit Profile</h3>
      <input type="text" id="editName" placeholder="Name">
      <input type="date" id="editDOB" placeholder="Date of Birth">
      <input type="text" id="editPhone" placeholder="Phone Number">
      <button id="saveEditBtn" class="btn" style="margin-top:1rem;">Save</button>
      <button class="close-btn" id="closeEditModal">Close</button>
    </div>
  </div>

  <!-- Modal for Password Verification -->
  <div id="verifyModal" class="modal">
    <div class="modal-content">
      <h3>Verify Email</h3>
      <input type="text" id="verificationCode" placeholder="Enter verification code">
      <input type="password" id="newPassword" placeholder="New password">
      <input type="password" id="confirmPassword" placeholder="Confirm password">
      <button id="submitVerification" class="btn" style="margin-top: 1rem;">Change password</button>
      <button class="close-btn" id="closeVerifyModal">Close</button>
    </div>
  </div>


  <script type="module">
    // Import Firebase Auth
    import { auth } from "./firebase-config.js";
    import { 
      onAuthStateChanged, 
      signOut, 
      deleteUser, 
      sendPasswordResetEmail,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

    let currentUser = null;

    // Wait for Firebase auth state
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = user;

      // Get data from Firebase user and localStorage
      const userEmail = user.email;
      const userName = user.displayName || localStorage.getItem('userName') || userEmail.split('@')[0];
      const userDOB = localStorage.getItem('userDOB');
      const userPhone = localStorage.getItem('userPhone');
      const userProfilePic = localStorage.getItem('userProfilePic');

      document.getElementById('profileName').textContent = userName || 'Not provided';
      document.getElementById('profileEmail').textContent = userEmail || 'Not provided';
      document.getElementById('profileDOB').textContent = userDOB || 'Not provided';
      document.getElementById('profilePhone').textContent = userPhone || 'Not provided';
      document.getElementById('profilePic').src = userProfilePic || 'https://via.placeholder.com/120?text=Profile';
    });

    document.addEventListener('DOMContentLoaded', function () {
      /* Change Picture */
      document.getElementById('changePicBtn').onclick = () => document.getElementById('changePicInput').click();

      document.getElementById('changePicInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const newPic = ev.target.result;
          document.getElementById('profilePic').src = newPic;
          localStorage.setItem('userProfilePic', newPic);
          alert('Profile picture updated!');
        };
        reader.readAsDataURL(file);
      });

      /* Logout - Using Firebase */
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (confirm('Log out?')) {
          try {
            await signOut(auth);
            localStorage.clear();
            window.location.href = 'login.html';
          } catch (error) {
            console.error('Logout error:', error);
            alert('Failed to log out. Please try again.');
          }
        }
      });

      /* Delete Account - Using Firebase */
      document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
        if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
          try {
            if (currentUser) {
              await deleteUser(currentUser);
              localStorage.clear();
              alert('Account deleted successfully.');
              window.location.href = 'signup.html';
            }
          } catch (error) {
            console.error('Delete account error:', error);
            if (error.code === 'auth/requires-recent-login') {
              alert('For security reasons, please log out and log in again before deleting your account.');
            } else {
              alert('Failed to delete account: ' + error.message);
            }
          }
        }
      });

      /* ----- EDIT PROFILE ----- */
      const editModal = document.getElementById('editModal');
      document.getElementById('editBtn').onclick = () => {
        editModal.style.display = 'flex';
        document.getElementById('editName').value = localStorage.getItem('userName') || '';
        document.getElementById('editDOB').value = localStorage.getItem('userDOB') || '';
        document.getElementById('editPhone').value = localStorage.getItem('userPhone') || '';
      };

      document.getElementById('closeEditModal').onclick = () => editModal.style.display = 'none';

      document.getElementById('saveEditBtn').onclick = async () => {
        const newName = document.getElementById('editName').value;
        const newDOB = document.getElementById('editDOB').value;
        const newPhone = document.getElementById('editPhone').value;

        try {
          // Update Firebase profile
          if (currentUser && newName) {
            await updateProfile(currentUser, { displayName: newName });
          }

          // Save to localStorage
          localStorage.setItem('userName', newName);
          localStorage.setItem('userDOB', newDOB);
          localStorage.setItem('userPhone', newPhone);

          document.getElementById('profileName').textContent = newName || 'Not provided';
          document.getElementById('profileDOB').textContent = newDOB || 'Not provided';
          document.getElementById('profilePhone').textContent = newPhone || 'Not provided';

          alert('Profile updated!');
          editModal.style.display = 'none';
        } catch (error) {
          console.error('Update profile error:', error);
          alert('Failed to update profile: ' + error.message);
        }
      };


      /* ----- PASSWORD RESET - Using Firebase ----- */
      document.getElementById('sendVerificationBtn').onclick = async () => {
        if (!currentUser || !currentUser.email) {
          alert('No user logged in.');
          return;
        }

        try {
          await sendPasswordResetEmail(auth, currentUser.email);
          alert('Password reset email sent to ' + currentUser.email + '. Please check your inbox.');
        } catch (error) {
          console.error('Password reset error:', error);
          alert('Failed to send password reset email: ' + error.message);
        }
      };

      // Hide the old verification modal since we're using Firebase email reset
      const verifyModal = document.getElementById('verifyModal');
      document.getElementById('closeVerifyModal').onclick = () => verifyModal.style.display = 'none';
    });
  </script>

</body>

</html>
