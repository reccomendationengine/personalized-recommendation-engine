<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - Personalized Recommendations Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, darkcyan 0%, darkorchid 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.5);
      margin-top: 1rem;
    }
    .profile-info {
      margin-top: 2rem;
      text-align: left;
      font-size: 1.2rem;
      line-height: 2rem;
    }
    .profile-info strong {
      color: #ffd6ff;
    }
    .btn-container {
      margin-top: 2.5rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .delete-btn {
      background: rgba(255, 0, 0, 0.3);
      border-color: rgba(255, 0, 0, 0.5);
    }
    .delete-btn:hover {
      background: rgba(255, 0, 0, 0.5);
    }
    #changePicInput {
      display: none;
    }
  </style>
</head>

<body>
  <div class="profile-container">
    <h1>Your Profile</h1>
    <img id="profilePic" src="" alt="Profile Picture" class="profile-pic">
    <br>
    <button id="changePicBtn" class="btn" style="margin-top: 1rem;">📸 Change Picture</button>
    <input type="file" id="changePicInput" accept="image/*">

    <p>View and manage your personal information.</p>

    <div class="profile-info">
      <p><strong>Name:</strong> <span id="profileName">Loading...</span></p>
      <p><strong>Email:</strong> <span id="profileEmail">Loading...</span></p>
      <p><strong>Date of Birth:</strong> <span id="profileDOB">Loading...</span></p>
      <p><strong>Phone:</strong> <span id="profilePhone">Loading...</span></p>
    </div>

    <div class="btn-container">
      <a href="dashboard.html" class="btn">⬅ Back to Dashboard</a>
      <button id="deleteAccountBtn" class="btn delete-btn">🗑 Delete Account</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, deleteUser, signOut } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";
    import { doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore.js";

    const profilePicElement = document.getElementById('profilePic');
    const changePicBtn = document.getElementById('changePicBtn');
    const changePicInput = document.getElementById('changePicInput');
    const deleteAccountBtn = document.getElementById('deleteAccountBtn');

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = user;

      // Get user data from Firestore
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        const userData = userDoc.exists() ? userDoc.data() : {};

        document.getElementById('profileName').textContent = userData.username || user.displayName || user.email.split('@')[0];
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profileDOB').textContent = userData.dateOfBirth || 'Not provided';
        document.getElementById('profilePhone').textContent = userData.phoneNumber || 'Not provided';
        profilePicElement.src = userData.profilePic || 'https://via.placeholder.com/120?text=Profile';
      } catch (err) {
        console.error("Error loading profile:", err);
        document.getElementById('profileName').textContent = user.displayName || user.email.split('@')[0];
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profileDOB').textContent = 'Not provided';
        document.getElementById('profilePhone').textContent = 'Not provided';
        profilePicElement.src = 'https://via.placeholder.com/120?text=Profile';
      }
    });

    // Change picture functionality
    changePicBtn.addEventListener('click', () => {
      changePicInput.click();
    });

    changePicInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file || !currentUser) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const newPic = e.target.result;
        profilePicElement.src = newPic;

        // Save to Firestore
        try {
          await updateDoc(doc(db, "users", currentUser.uid), { profilePic: newPic });
          alert('Profile picture updated successfully!');
        } catch (err) {
          console.error("Error updating profile pic:", err);
          alert('Failed to save profile picture.');
        }
      };
      reader.readAsDataURL(file);
    });

    // Delete account
    deleteAccountBtn.addEventListener('click', async function() {
      if (!currentUser) return;

      if (confirm('Are you sure you want to delete your account? This cannot be undone.')) {
        try {
          // Delete Firestore user document
          await deleteDoc(doc(db, "users", currentUser.uid));
          // Delete Firebase Auth user
          await deleteUser(currentUser);
          alert('Your account has been deleted.');
          window.location.href = 'signup.html';
        } catch (err) {
          console.error("Error deleting account:", err);
          // If requires recent login
          if (err.code === 'auth/requires-recent-login') {
            alert('Please log out and log back in, then try deleting again.');
          } else {
            alert('Failed to delete account: ' + err.message);
          }
        }
      }
    });
  </script>
</body>
</html>
